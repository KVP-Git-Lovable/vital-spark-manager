# Deliberately NOT verify_jwt = false, unlike the sf-* functions above. This one
# walks every patient record in Salesforce, so it is left behind the platform's
# JWT check rather than being publicly callable. A service-role key is a valid
# JWT, so running it from the dashboard or a server still works.
[functions.sf-import-all-patients]
verify_jwt = true

[functions.sf-backfill-registered-at]
verify_jwt = true

[functions.sf-refresh-patient-names]
